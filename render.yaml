services:
  - type: web
    name: kisanjalsetu-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: NODE_ENV=production node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secrets — set these manually in the Render dashboard (value kept out of repo)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_SERVER_KEY
        sync: false
      # Safe defaults (committed)
      - key: JWT_EXPIRES_IN
        value: "30d"
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_RESEND_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_PROVIDER
        value: "log"
      - key: CORS_ORIGINS
        value: "https://kisanjalsetu-backend.onrender.com,https://kisanjalsetu-admin.onrender.com,https://localhost,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176"

  - type: web
    name: kisanjalsetu-admin
    runtime: static
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://kisanjalsetu-backend.onrender.com/api"

